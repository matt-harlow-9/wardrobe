name: Wardrobe
options:
  bundleIdPrefix: com.cloaknine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YZ5QGM3HQV
targets:
  Wardrobe:
    type: application
    platform: iOS
    sources: [Wardrobe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloaknine.wardrobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wardrobe
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
